<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vimeo player play() repro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 8px; color: #aaa; }
    #player { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 0; display: block; }
    #log { margin-top: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    .ok { color: #7c7; } .bad { color: #f77; } .dim { color: #888; }
  </style>
</head>
<body>
  <h1>Vimeo player: play() without a user gesture</h1>
  <p>A bare Vimeo iframe, no SDK. Waits for the player's <code>ready</code> message, then posts <code>{ method: "play" }</code> from a <code>setTimeout</code>. No gesture, no autoplay parameter. Read the Vimeo player build from the iframe's network requests and note it by hand.</p>
  <iframe id="player"
    src="https://player.vimeo.com/video/43652787"
    allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    title="Test Video"></iframe>
  <div id="log"></div>
  <script src="repro.js"></script>
</body>
</html>
